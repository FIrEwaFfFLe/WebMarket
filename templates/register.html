<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Регистрация - EliteDrive</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/index_icon.ico') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <a class="logo" href="{{ url_for('index') }}">
                <img src="{{ url_for('static', filename='images/logo.png') }}" alt="EliteDrive Logo" class="logo-img">
                <strong class="logo-text">EliteDrive</strong>
            </a>
        </div>
    </header>

    <main style="max-width: 500px; margin: 40px auto; padding: 0 20px;">
        <h1>Регистрация в EliteDrive</h1>
        <div>
            <form class="login_form" method="post">
                <div style="margin-bottom: 15px;">
                    <input type="text" class="form-control" id="first_name" placeholder="Введите имя" name="first_name" style="width: 100%; padding: 10px; margin: 5px 0;">
                </div>
                <div style="margin-bottom: 15px;">
                    <input type="text" class="form-control" id="last_name" placeholder="Введите фамилию" name="last_name" style="width: 100%; padding: 10px; margin: 5px 0;">
                </div>
                <div style="margin-bottom: 15px;">
                    <input type="email" class="form-control" id="email" placeholder="Введите адрес почты" name="email" style="width: 100%; padding: 10px; margin: 5px 0;">
                </div>
                <div style="margin-bottom: 15px;">
                    <input type="password" class="form-control" id="password" placeholder="Введите пароль" name="password" style="width: 100%; padding: 10px; margin: 5px 0;">
                </div>
                <div style="margin-bottom: 15px;">
                    <input type="password" class="form-control" id="confirm_password" placeholder="Подтвердите пароль" name="confirm_password" style="width: 100%; padding: 10px; margin: 5px 0;">
                </div>
                <div style="margin-bottom: 15px;">
                    <input type="tel" class="form-control" id="phone" placeholder="Введите телефон" name="phone" style="width: 100%; padding: 10px; margin: 5px 0;">
                </div>
                <div style="margin-bottom: 15px;">
                    <label for="birthdate">Дата рождения</label>
                    <input type="date" class="form-control" id="birthdate" name="birthdate" style="width: 100%; padding: 10px; margin: 5px 0;">
                </div>
                <div style="margin-bottom: 15px;">
                    <label>Пол</label>
                    <div>
                        <input type="radio" name="gender" id="male" value="male" checked>
                        <label for="male">Мужской</label>
                    </div>
                    <div>
                        <input type="radio" name="gender" id="female" value="female">
                        <label for="female">Женский</label>
                    </div>
                </div>
                <div style="margin-bottom: 15px;">
                    <input type="checkbox" id="acceptRules" name="accept">
                    <label for="acceptRules">Я соглашаюсь с условиями использования</label>
                </div>
                <button type="submit" style="background: linear-gradient(90deg,#111827,#1b2430); color: white; padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer;">Зарегистрироваться</button>
            </form>
        </div>
        <p style="margin-top: 20px;">Уже есть аккаунт? <a href="{{ url_for('login') }}">Войдите</a></p>
    </main>
</body>
</html>
